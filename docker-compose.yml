# Media stack: Jellyfin, sports feeds, download automation, and management tools.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Main media server. Sportyfin writes playlists and guide data into /sportyfin.
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - /home/steirter/jellyfin/config:/config
      - /home/steirter/jellyfin/cache:/cache
      - /home/steirter/sportyfin/output:/sportyfin
      - /media/synology_media:/media
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8096:8096"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - media

  # Searches for missing TV theme songs and saves them as theme.mp3 for Jellyfin.
  theme-downloader:
    image: jauderho/yt-dlp:latest
    container_name: theme-downloader
    entrypoint: ["/bin/sh"]
    command: ["/scripts/download-theme-songs.sh"]
    environment:
      SHOWS_DIR: /shows
      MOVIES_DIR: /movies
      DOWNLOAD_INTERVAL_SECONDS: "86400"
      TZ: Etc/UTC
    volumes:
      - /media/synology_media/shows:/shows
      - /media/synology_media/movies:/movies
      - /home/steirter/dockerCompose/theme-downloader:/scripts:ro
      - /home/steirter/theme-downloader:/data
    restart: unless-stopped
    logging: *default-logging
    networks:
      - media

  # Generates sports M3U playlists and XMLTV guide data for Jellyfin Live TV.
  sportyfin:
    image: sportyfin/sportyfin:latest
    container_name: sportyfin
    volumes:
      - /home/steirter/sportyfin/output:/sportyfin/output
    restart: unless-stopped
    logging: *default-logging
    networks:
      - media

  # Simple homepage for the services in this stack.
  homer:
    image: b4bz/homer
    container_name: homer
    volumes:
      - /home/steirter/homer:/www/assets
    ports:
      - "80:8080"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - media

  # Requests media and connects Jellyfin to the download automation services.
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    environment:
      LOG_LEVEL: info
      TZ: Etc/UTC
      PUID: "1000"
      PGID: "1001"
    volumes:
      - /home/steirter/jellyseerr/config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5055/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    ports:
      - "5055:5055"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - media

  # Finds and manages TV series downloads.
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - /home/steirter/sonarr/config:/config
      - /media/synology_media/shows:/shows
      - /media/synology_media/downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "8989:8989"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - media

  # Finds and manages movie downloads.
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - /home/steirter/radarr/config:/config
      - /media/synology_media/movies:/movies
      - /media/synology_media/downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "7878:7878"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - media

  # Downloads subtitles for the movies and shows managed by Radarr and Sonarr.
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - /home/steirter/bazarr/config:/config
      - /media/synology_media/movies:/movies
      - /media/synology_media/shows:/shows
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6767/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    ports:
      - "6767:6767"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - media

  # Torrent client used by Radarr and Sonarr.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      WEBUI_PORT: "8080"
    volumes:
      - /home/steirter/qbittorrent/appdata:/config
      - /media/synology_media/downloads:/downloads
      - /home/steirter/qbittorrent/ssl:/ssl
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - media

  # Indexer manager used by Radarr and Sonarr.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - /home/steirter/prowlarr/config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9696/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "9696:9696"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - media

  # Docker management interface.
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/steirter/portainer/data:/data
    ports:
      - "9000:9000"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - media

  # Live container log viewer.
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9999:8080"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - media

  # Container uptime and availability monitoring.
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    volumes:
      - /home/steirter/uptime-kuma:/app/data
    ports:
      - "3001:3001"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - media

# A shared bridge lets the services reach each other by service name.
networks:
  media:
    driver: bridge
