services:

  jellyfin:              ## Main media server
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1001
      - TZ=Etc/UTC
    volumes:
      - /home/steirter/jellyfin/config:/config
      - /home/steirter/jellyfin/cache:/cache
      - /mnt:/mnt
      - /home/steirter/media:/internal
    ports:
      - 8096:8096
    ## restart: unless-stopped

  ## Simple homepage for every service

  homer:
    image: b4bz/homer
    container_name: homer
    ports:
      - "80:8080"
    volumes:
      - /home/steirter/homer:/www/assets
    restart: unless-stopped

  ## Making sure that I can watch the movies I want with the right subtitles

  jellyseerr:            ## Requester to Radarr or Sonarr
      image: fallenbagel/jellyseerr:latest
      container_name: jellyseerr
      environment:
        - LOG_LEVEL=debug
        - TZ=Etc/UTC
        - PUID=1000
        - PGID=1001
      ports:
        - 5055:5055
      volumes:
        - /home/steirter/jellyseerr/config:/app/config
      restart: unless-stopped
  
  sonarr:                ## Download subtitles for shows
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1001
      - TZ=Etc/UTC
    volumes:
    - /home/steirter/sonarr/config:/config
    - /mnt/media/media/shows:/shows
    - /home/steirter/Downloads/Torrents:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:                ## Download subtitles for movies
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1001
      - TZ=Etc/UTC
    volumes:
    - /home/steirter/radarr/config:/config
    - /mnt/media/media/movies:/movies
    - /home/steirter/Downloads/Torrents:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  bazarr:                ## Connect subtitles to movies and shows
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1001
      - TZ=Etc/UTC
    volumes:
    - /home/steirter/bazarr/config:/config
    - /mnt/media/media/movies:/movies
    - /mnt/media/media/shows:/shows

    ports:
      - 6767:6767
    restart: unless-stopped
  
  qbittorrent:           ## Torrent client
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1001
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
    volumes:
      - /home/steirter/qbittorrent/appdata:/config
      - /home/steirter/Downloads/Torrents:/downloads
      - /home/steirter/qbittorrent/ssl:/ssl
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  prowlarr:              ## Indexer for Torrent
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1001
      - TZ=Etc/UTC
    volumes:
      - /home/steirter/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  ## Back End for keeping track and making sure everything runs 
  portainer:             ## check on the health of docker containers
    image: portainer/portainer-ce:latest
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/steirter/portainer/data:/data
    ports:
      - 9000:9000
    restart: unless-stopped

  dozzle:                ## check on log files of the container
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9999:8080
    restart: unless-stopped

  uptime-kuma:           ## check on uptime of  docker containers
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    volumes:
      - /home/steirter/uptime-kuma:/app/data
    ports:
      - 3001:3001
    restart: unless-stopped
